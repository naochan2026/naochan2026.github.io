<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0d0020"/>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0840"/>
      <stop offset="100%" stop-color="#0d0020"/>
    </radialGradient>
  </defs>
  <!-- 王冠 -->
  <text x="256" y="340" font-size="320" text-anchor="middle"
        font-family="serif" fill="#FFD700"
        filter="url(#glow)">♔</text>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- タイトル -->
  <text x="256" y="460" font-size="46" text-anchor="middle"
        font-family="serif" fill="#e8c860" letter-spacing="4">KING</text>
</svg>
